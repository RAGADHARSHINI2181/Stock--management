<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #007bff;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        .submit-btn {
            grid-column: span 2;
        }

        .search {
            width: 100%;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #007bff;
            color: white;
        }

        .edit {
            background: #28a745;
            margin-right: 5px;
        }

        .delete {
            background: #dc3545;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            display: none;
            border-radius: 5px;
        }

        @media (max-width: 700px) {
            form {
                grid-template-columns: 1fr;
            }

            .submit-btn {
                grid-column: span 1;
            }

            table {
                font-size: 12px;
            }

            body {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Stock Management System</h1>

    <div id="message" class="message"></div>

    <form id="stockForm">

        <input
            type="text"
            id="name"
            placeholder="Item Name"
            required
        >

        <input
            type="text"
            id="category"
            placeholder="Category"
            required
        >

        <input
            type="number"
            id="quantity"
            placeholder="Quantity"
            min="0"
            required
        >

        <input
            type="number"
            id="price"
            placeholder="Price"
            min="0"
            step="0.01"
            required
        >

        <input
            type="text"
            id="supplier"
            placeholder="Supplier"
            required
        >

        <button type="submit" class="submit-btn" id="submitBtn">
            Add Item
        </button>

    </form>

    <input
        type="text"
        id="search"
        class="search"
        placeholder="Search items..."
    >

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Item Name</th>
                <th>Category</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Supplier</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="stockTable">
        </tbody>

    </table>

</div>

<script>

    let stocks = JSON.parse(localStorage.getItem("stocks")) || [];

    let editId = null;

    const form = document.getElementById("stockForm");
    const nameInput = document.getElementById("name");
    const categoryInput = document.getElementById("category");
    const quantityInput = document.getElementById("quantity");
    const priceInput = document.getElementById("price");
    const supplierInput = document.getElementById("supplier");

    const table = document.getElementById("stockTable");
    const searchInput = document.getElementById("search");
    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");


    function saveData() {
        localStorage.setItem("stocks", JSON.stringify(stocks));
    }


    function showMessage(text, type) {

        message.textContent = text;
        message.style.display = "block";

        if (type === "success") {
            message.style.background = "#d4edda";
            message.style.color = "#155724";
        } else {
            message.style.background = "#f8d7da";
            message.style.color = "#721c24";
        }

        setTimeout(() => {
            message.style.display = "none";
        }, 2000);
    }


    function displayStocks(data = stocks) {

        table.innerHTML = "";

        if (data.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="7">
                        No stock items found
                    </td>
                </tr>
            `;

            return;
        }


        data.forEach(stock => {

            const row = document.createElement("tr");

            row.innerHTML = `

                <td>${stock.id}</td>

                <td>${stock.name}</td>

                <td>${stock.category}</td>

                <td>${stock.quantity}</td>

                <td>₹${Number(stock.price).toFixed(2)}</td>

                <td>${stock.supplier}</td>

                <td>

                    <button
                        class="edit"
                        onclick="editStock(${stock.id})">
                        Edit
                    </button>

                    <button
                        class="delete"
                        onclick="deleteStock(${stock.id})">
                        Delete
                    </button>

                </td>
            `;

            table.appendChild(row);

        });

    }


    form.addEventListener("submit", function(event) {

        event.preventDefault();


        const name = nameInput.value.trim();
        const category = categoryInput.value.trim();
        const quantity = Number(quantityInput.value);
        const price = Number(priceInput.value);
        const supplier = supplierInput.value.trim();


        if (!name || !category || !supplier) {

            showMessage(
                "Please fill all required fields.",
                "error"
            );

            return;
        }


        if (quantity < 0 || price < 0) {

            showMessage(
                "Quantity and price cannot be negative.",
                "error"
            );

            return;
        }


        // UPDATE
        if (editId !== null) {

            const index = stocks.findIndex(
                stock => stock.id === editId
            );


            if (index !== -1) {

                stocks[index] = {

                    id: editId,
                    name: name,
                    category: category,
                    quantity: quantity,
                    price: price,
                    supplier: supplier

                };

            }

            showMessage(
                "Stock updated successfully!",
                "success"
            );

            editId = null;

            submitBtn.textContent = "Add Item";

        }

        // CREATE
        else {

            const newStock = {

                id: Date.now(),

                name: name,

                category: category,

                quantity: quantity,

                price: price,

                supplier: supplier

            };


            stocks.push(newStock);


            showMessage(
                "Stock added successfully!",
                "success"
            );

        }


        saveData();

        displayStocks();

        form.reset();

    });


    // EDIT
    function editStock(id) {

        const stock = stocks.find(
            stock => stock.id === id
        );


        if (!stock) return;


        nameInput.value = stock.name;

        categoryInput.value = stock.category;

        quantityInput.value = stock.quantity;

        priceInput.value = stock.price;

        supplierInput.value = stock.supplier;


        editId = id;

        submitBtn.textContent = "Update Item";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    // DELETE
    function deleteStock(id) {

        const confirmation = confirm(
            "Are you sure you want to delete this item?"
        );


        if (!confirmation) return;


        stocks = stocks.filter(
            stock => stock.id !== id
        );


        saveData();

        displayStocks();


        showMessage(
            "Stock deleted successfully!",
            "success"
        );

    }


    // SEARCH
    searchInput.addEventListener("input", function() {

        const searchText =
            searchInput.value.toLowerCase();


        const filtered = stocks.filter(stock =>

            stock.name.toLowerCase()
                .includes(searchText)

            ||

            stock.category.toLowerCase()
                .includes(searchText)

            ||

            stock.supplier.toLowerCase()
                .includes(searchText)

        );


        displayStocks(filtered);

    });


    // INITIAL DISPLAY
    displayStocks();

</script>

</body>
</html>
